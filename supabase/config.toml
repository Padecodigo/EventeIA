# EventeIA — Supabase local (CLI)
# Ver README.md (seção "Começando") e .context/DATABASE_RLS.md.

project_id = "eventeia"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/entrar", "http://localhost:3000/painel", "http://localhost:3000/auth/callback", "https://app.eventeia.com.br/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Login com Google (docs/GOOGLE-LOGIN.md). Credenciais só via env — nunca no repo.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = true

[storage]
enabled = true
file_size_limit = "5MiB"

[analytics]
enabled = false
