# Infra LOCAL de desenvolvimento (não usar em produção).
# Uso: docker compose -f docker-compose.dev.yml --env-file .env.local up -d
# Segredos vêm do .env.local (nunca commitado); nada sensível fica neste arquivo.
name: eventeia-dev

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
