# Correções do pnpm audit (escopadas para não afetar outras dependências).
# Lighthouse CI roda sob demanda (pnpm dlx @lhci/cli) e não é dependência do projeto.
overrides:
  postcss: "^8.5.23"
  "@sentry/node>cookie": "^0.7.0"
  tmp: "^0.2.6"
  zod: ">=4.6.6"
  basic-ftp: "^6.2.1"
  # GHSA-g3hv-75wg-m249: minimatch <11.0.1 (DoS). Escopo só na linha 10.x;
  # não sobrescrever 3.x (eslint 8 depende da API CJS).
  minimatch@10: "^11.0.1"
# pnpm >= 10 bloqueia scripts de build por padrão; libera só os necessários.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - unrs-resolver
