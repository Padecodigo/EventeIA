# Correções do pnpm audit (escopadas para não afetar outras dependências).
# Lighthouse CI roda sob demanda (pnpm dlx @lhci/cli) e não é dependência do projeto.
overrides:
  postcss: "^8.5.23"
  "@sentry/node>cookie": "^0.7.0"
  tmp: "^0.2.6"
  zod: ">=4.6.6"
  basic-ftp: "^6.2.1"
# pnpm >= 10 bloqueia scripts de build por padrão; libera só os necessários.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - unrs-resolver

# GHSA-fc5q-39xc-vjpf: ReDoS no picomatch (<=4.0.7). Ainda não há versão corrigida
# (npm registry: latest 4.0.7; patched versions: none em 18/11/2026). Só atinge
# ferramentas de dev/build (Tailwind, knip, eslint-config-next). Revisitar quando
# houver patch. Não ignora outros avisos (ex.: minimatch).
audit:
  ignore:
    - GHSA-fc5q-39xc-vjpf
