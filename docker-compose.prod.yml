# EventeIA — PRODUÇÃO (Hetzner CX33 4 vCPU / 8 GB + Coolify/Traefik).
# Dev continua em docker-compose.dev.yml. Guia: docs/DEPLOY-PRODUCAO.md
# Segredos: variáveis do Coolify (ou --env-file .env.production). Nada sensível aqui.
# Só `app` recebe labels Traefik; redis/worker ficam
# apenas na rede interna (sem `ports:`).
# Orçamento de RAM (~5,3 GB de limite; resto p/ SO, Docker, Coolify, Traefik):
#   app 1536M | worker 1024M | redis 640M
name: eventeia
# Hostnames internos usam aliases com prefixo `eventeia-`: app e redis
# também estão na rede `coolify`, onde `coolify-redis` responde como `redis`
# (e `coolify-db` como `postgres`). Nomes curtos colidiriam.

x-app-env: &app-env
  NODE_ENV: production
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?}
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@eventeia-redis:6379/0
  ASAAS_ENVIRONMENT: ${ASAAS_ENVIRONMENT:-sandbox}
  ASAAS_API_URL: ${ASAAS_API_URL:-}
  ASAAS_API_KEY: ${ASAAS_API_KEY:?}
  ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:?}
  B2C_TICKET_PRICE_CENTS: ${B2C_TICKET_PRICE_CENTS:-}
  ENGINE_TIMEZONE: ${ENGINE_TIMEZONE:-America/Sao_Paulo}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  SERPER_API_KEY: ${SERPER_API_KEY:-}
  SERPER_MIN_CREDITS: ${SERPER_MIN_CREDITS:-100}
  GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
  META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
  META_PAGE_ID: ${META_PAGE_ID:-}
  META_INSTAGRAM_BUSINESS_ID: ${META_INSTAGRAM_BUSINESS_ID:-}
  META_PROSPECT_KEYWORD: ${META_PROSPECT_KEYWORD:-cotação}
  MODELSLAB_API_KEY: ${MODELSLAB_API_KEY:-}
  REQUIRE_APPROVAL: ${REQUIRE_APPROVAL:-true}
  MAX_POSTS_PER_DAY: ${MAX_POSTS_PER_DAY:-2}
  MAX_TAGS_PER_POST: ${MAX_TAGS_PER_POST:-8}
  MIN_POST_INTERVAL_MINUTES: ${MIN_POST_INTERVAL_MINUTES:-60}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  FINANCE_ALERT_EMAIL: ${FINANCE_ALERT_EMAIL:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
  DEEPSEEK_MOCK: ${DEEPSEEK_MOCK:-false}
  XAI_API_KEY: ${XAI_API_KEY:-}
  NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
  NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-}
  # Provedor de imagem (modelslab | nvidia) e modelo NVIDIA
  IMAGE_PROVIDER: ${IMAGE_PROVIDER:-modelslab}
  SESSION_MAX_AGE_MINUTES: ${SESSION_MAX_AGE_MINUTES:-120}
  NVIDIA_IMAGE_MODEL: ${NVIDIA_IMAGE_MODEL:-black-forest-labs/flux-3-image-klein}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  EMAIL_MOCK: ${EMAIL_MOCK:-false}
  SUPPORT_ADMIN_EMAIL: ${SUPPORT_ADMIN_EMAIL:-}
  WELCOME_HASH_SALT: ${WELCOME_HASH_SALT:?}
  # Cadeia de descoberta: OSM/Overpass (grátis) primeiro, depois Serper com
  # fallback automático para a DeepSeek Search API. Sem Google Places.
  DISCOVERY_PROVIDERS: ${DISCOVERY_PROVIDERS:-overpass,serper}
  DISCOVERY_INGEST_SECRET: ${DISCOVERY_INGEST_SECRET:-}
  FINANCE_FX_BRL_PER_USD_MICRO: ${FINANCE_FX_BRL_PER_USD_MICRO:-}
  FINANCE_PRICES_JSON: ${FINANCE_PRICES_JSON:-}
  INDEXNOW_KEY: ${INDEXNOW_KEY:-}
  DEMO_LOGIN_ENABLED: "false"
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
    image: eventeia-app:latest
    restart: unless-stopped
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
    networks:
      internal: { aliases: [eventeia-app] }
      coolify: {}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources: { limits: { memory: 1536M, cpus: "2.0" } }
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.eventeia-app.rule=Host(`${APP_DOMAIN:?}`)
      - traefik.http.routers.eventeia-app.entrypoints=https
      - traefik.http.routers.eventeia-app.tls=true
      - traefik.http.routers.eventeia-app.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.eventeia-app.loadbalancer.server.port=3000

  worker:
    image: eventeia-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker
    pull_policy: never
    restart: unless-stopped
    environment: *app-env
    volumes:
      - instagram-session:/data
    depends_on:
      app: { condition: service_started }
      redis: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      # Processo vivo (tsx) — o worker não expõe HTTP.
      test: ["CMD-SHELL", "pgrep -f 'tsx workers/index.ts' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
    deploy:
      resources: { limits: { memory: 1536M, cpus: "1.5" } }
    logging: *logging
    labels: [traefik.enable=false]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes: [redis-data:/data]
    networks:
      internal: { aliases: [eventeia-redis] }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources: { limits: { memory: 640M } }
    logging: *logging
    labels: [traefik.enable=false]

networks:
  internal:
    driver: bridge
    # Não é `internal: true`: o worker precisa de egress (Supabase, Asaas, LLMs).
    # Redis/Postgres seguem privados porque não publicam `ports:`.
  coolify:
    external: true

volumes:
  redis-data:
  instagram-session:

